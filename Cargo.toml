[package]
name = "repolint"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Repository structure map generator and gate"
readme = "README.md"
repository = "https://github.com/tailrocks/repolint"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
